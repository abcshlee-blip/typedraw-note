<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>TypeDraw fold check</title>
<style>
  html, body { margin: 0; padding: 0; background: #6f6a62; }
  #f { display: block; border: 0; margin: 0 auto; background: #fff; }
</style>
</head>
<body>
<iframe id="f" src="index.html"></iframe>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get('w') || '680', 10);
  var h = parseInt(p.get('h') || '860', 10);
  var f = document.getElementById('f');
  f.width = w; f.height = h;
  f.addEventListener('load', function () {
    setTimeout(function () {
      try {
        var d = f.contentDocument;
        var book = d.querySelector('.book');
        if (book) book.click();
      } catch (e) { console.error(e); }
    }, 500);
  });
  window.__m = function () {
    var d = f.contentDocument, win = f.contentWindow;
    var pages = [].slice.call(d.querySelectorAll('#spread .page')).map(function (pg) {
      var r = pg.getBoundingClientRect();
      return { id: pg.dataset.pageId, x: +r.x.toFixed(1), y: +r.y.toFixed(1), w: +r.width.toFixed(1), h: +r.height.toFixed(1),
               right: +r.right.toFixed(1), bottom: +r.bottom.toFixed(1) };
    });
    var sw = d.querySelector('#viewSwitch');
    var pressed = null;
    if (sw) { [].slice.call(sw.querySelectorAll('button')).forEach(function (b) { if (b.getAttribute('aria-pressed') === 'true') pressed = b.dataset.view; }); }
    var stage = d.querySelector('#stage').getBoundingClientRect();
    var last = pages[pages.length - 1];
    return {
      innerWidth: win.innerWidth, innerHeight: win.innerHeight,
      isSpread: d.querySelector('#spread').classList.contains('is-spread'),
      pages: pages, mode: pressed,
      label: d.querySelector('#pageLabel').textContent,
      sub: d.querySelector('#noteSub').textContent,
      stage: { w: +stage.width.toFixed(1), h: +stage.height.toFixed(1) },
      fits: !last || (last.right <= win.innerWidth + 0.5 && last.bottom <= win.innerHeight + 0.5 && pages[0].x >= -0.5 && pages[0].y >= -0.5),
      scrollW: d.documentElement.scrollWidth, scrollH: d.documentElement.scrollHeight,
      ls: (function () { try { return win.localStorage.getItem('tdn.viewMode'); } catch (e) { return 'err'; } })(),
      errors: window.__errs || []
    };
  };
  window.__click = function (sel) {
    var el = f.contentDocument.querySelector(sel);
    if (!el) return 'not found: ' + sel;
    el.click();
    return 'clicked ' + sel;
  };
  window.__errs = [];
</script>
</body>
</html>
